name: EMP CI (Linux)
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core-php:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
      - name: PHP disponibile
        run: php -v && php -m | grep -iE 'pdo_sqlite|zip|mbstring'
      - name: Sintassi PHP
        run: |
          set -e
          find src public bin ../plugins ../tools -type f \( -name '*.php' -o -name emp \) -print0 | xargs -0 -n1 php -l
      - name: Dipendenze di sviluppo
        run: composer install --no-interaction --no-progress
      - name: Test Core
        run: vendor/bin/phpunit

  desk-rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: desk
    steps:
      - uses: actions/checkout@v4
      - name: Librerie di sistema per Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev
      - name: Rust
        run: rustup default stable && rustup component add clippy
      - name: Icona provvisoria
        run: |
          mkdir -p app/src-tauri/icons
          python3 - <<'PY'
          import struct, zlib
          w = h = 32
          raw = b''.join(b'\x00' + bytes([30, 58, 95, 255]) * w for _ in range(h))
          def chunk(t, d): return struct.pack('>I', len(d)) + t + d + struct.pack('>I', zlib.crc32(t + d) & 0xffffffff)
          png = b'\x89PNG\r\n\x1a\n' + chunk(b'IHDR', struct.pack('>IIBBBBB', w, h, 8, 6, 0, 0, 0)) + chunk(b'IDAT', zlib.compress(raw)) + chunk(b'IEND', b'')
          ico = struct.pack('<HHH', 0, 1, 1) + struct.pack('<BBBBHHII', w, h, 0, 0, 1, 32, len(png), 22) + png
          open('app/src-tauri/icons/icon.ico', 'wb').write(ico)
          open('app/src-tauri/icons/icon.png', 'wb').write(png)
          PY
      - name: Clippy (warning bloccanti)
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked --workspace

  end-to-end:
    needs: [core-php, desk-rust]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Rust
        run: rustup default stable
      - name: Desk installa il Core → il Core installa un plugin dal web
        run: |
          set -euo pipefail
          W="$RUNNER_TEMP/e2e"
          B=http://127.0.0.1:8765
          # 1. Pacchetto del Core (per Desk) e catalogo dei plugin (per il Core).
          php tools/build-packages.php core "$W/pacchetti-core"
          php tools/build-packages.php plugin "$W/catalogo" --con-esempi
          # 2. EMP Desk installa solo il Core.
          cargo run --locked -q --manifest-path desk/Cargo.toml -p emp-core-installer --example emp-install -- "$W/pacchetti-core" "$W/modules"
          test ! -d "$W/modules/emp-esempio"
          # 3. Il Core prepara il database.
          printf "<?php return ['dsn' => 'sqlite:%s/emp.db', 'modules_dir' => '%s/modules', 'catalog_dir' => '%s/catalogo'];\n" "$W" "$W" "$W" > "$W/config.php"
          export EMP_CONFIG="$W/config.php"
          php "$W/modules/emp-core/bin/emp" installa --utente=ci
          php -S 127.0.0.1:8765 -t "$W/modules/emp-core/public" "$W/modules/emp-core/public/index.php" > "$W/server.log" 2>&1 &
          sleep 2
          curl -fsS $B/api/v1/salute | tee /dev/stderr | grep -q '"stato":"ok"'
          curl -fsS -o /dev/null $B/amministrazione/plugin.html
          # 4. Primo setup del Tecnico e accesso (solo password, offline).
          J=(-H 'X-EMP-Richiesta: 1' -H 'Content-Type: application/json')
          test "$(curl -s -o /dev/null -w '%{http_code}' $B/api/v1/plugin)" = 401
          curl -fsS "${J[@]}" -X POST $B/api/v1/accesso/setup -d '{"username":"tecnico","nome":"Tecnico CI","password":"Chiave-Sicura-CI-2026"}' | grep -q '"recovery_key":"EMP-'
          test "$(curl -s -o /dev/null -w '%{http_code}' "${J[@]}" -X POST $B/api/v1/accesso/setup -d '{"username":"altro","nome":"Altro","password":"Chiave-Sicura-CI-2026"}')" = 409
          curl -fsS -c "$W/jar" "${J[@]}" -X POST $B/api/v1/accesso/login -d '{"username":"tecnico","password":"Chiave-Sicura-CI-2026"}' | grep -q '"ruolo":"tecnico"'
          # 5. Pagina Plugin: elenco, protezioni, installazione.
          curl -fsS -b "$W/jar" $B/api/v1/plugin | tee /dev/stderr | grep -q '"stato":"installabile"'
          test "$(curl -s -o /dev/null -w '%{http_code}' -b "$W/jar" -X POST $B/api/v1/plugin/emp-esempio/installa)" = 403
          test "$(curl -s -o /dev/null -w '%{http_code}' -b "$W/jar" -H 'Host: evil.example' $B/api/v1/plugin)" = 403
          curl -fsS -b "$W/jar" "${J[@]}" -X POST $B/api/v1/plugin/emp-esempio/installa | tee /dev/stderr | grep -q '"ok":true'
          curl -fsS $B/api/v1/esempio | grep -q '"modulo":"emp-esempio"'
          # 6. Desk rieseguito: Core invariato, plugin intatto.
          cargo run --locked -q --manifest-path desk/Cargo.toml -p emp-core-installer --example emp-install -- "$W/pacchetti-core" "$W/modules" | grep -q '^invariato emp-core'
          test -f "$W/modules/emp-esempio/emp-module.json"
