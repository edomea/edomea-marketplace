name: EMP Desk Windows — validazione di sicurezza
on:
  push:
    branches: [main]
    paths:
      - 'desk/**'
      - 'core/**'
      - 'plugins/**'
      - 'tools/**'
      - '.github/workflows/desk-windows.yml'
  pull_request:
    paths:
      - 'desk/**'
      - 'core/**'
      - 'plugins/**'
      - 'tools/**'
      - '.github/workflows/desk-windows.yml'
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 90
    defaults:
      run:
        working-directory: desk/app/src-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: zip
          tools: none
      - name: Prepare Rust
        shell: pwsh
        run: rustup default stable
      - name: Generate application icon
        shell: powershell
        run: |
          Add-Type -AssemblyName System.Drawing
          New-Item -ItemType Directory -Force icons | Out-Null
          $stream = [IO.File]::Create((Join-Path (Get-Location) 'icons/icon.ico'))
          try { [System.Drawing.SystemIcons]::Application.Save($stream) } finally { $stream.Dispose() }
      - name: Verify committed lockfile
        shell: pwsh
        run: |
          # Cargo.lock è versionato: la build usa esattamente le dipendenze revisionate.
          cargo metadata --locked --format-version 1 > $null
          if ($LASTEXITCODE -ne 0) { throw 'Cargo.lock missing or out of date' }
      - name: Build Core package (Desk installs only emp-core)
        shell: pwsh
        run: |
          php -v
          if ($LASTEXITCODE -ne 0) { throw 'PHP not available on runner' }
          php ../../../tools/build-packages.php core pacchetti
          if ($LASTEXITCODE -ne 0) { throw 'Package build failed' }
      - name: Bundle official PHP for Windows (lab mode)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Official build from windows.php.net, PHP 8.3 NTS x64; SHA-256 from the official index.
          $rel = Invoke-RestMethod -Uri 'https://windows.php.net/downloads/releases/releases.json'
          $branch = $rel.'8.3'
          $key = @($branch.PSObject.Properties.Name | Where-Object { $_ -match '^nts-vs\d+-x64$' })[0]
          if (!$key) { throw 'PHP 8.3 NTS x64 build not found in official index' }
          $zip = $branch.$key.zip
          Invoke-WebRequest -Uri ("https://windows.php.net/downloads/releases/" + $zip.path) -OutFile php.zip
          $hash = (Get-FileHash php.zip -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne $zip.sha256.ToLower()) { throw 'PHP download checksum mismatch' }
          Remove-Item php -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive php.zip -DestinationPath php
          @(
            '; php.ini di EMP Desk (modalità laboratorio). extension_dir è passato da Desk.',
            'extension=pdo_sqlite',
            'extension=mbstring',
            'extension=zip',
            'memory_limit=256M',
            'display_errors=Off',
            'log_errors=On',
            'expose_php=Off',
            'date.timezone=Europe/Rome'
          ) | Set-Content php/php.ini -Encoding ascii
          Copy-Item ../../../LICENSE php/EMP-LICENSE.txt -ErrorAction SilentlyContinue
          "PHP $($branch.version) $key $($zip.path) sha256=$hash" | Set-Content php-version.txt
          Get-Content php-version.txt
          & php/php.exe -c php/php.ini -d ("extension_dir=" + (Resolve-Path php/ext)) -m
          if ($LASTEXITCODE -ne 0) { throw 'Bundled PHP does not start' }
          "php=$($branch.version)" | Set-Content versione-php.txt
      - name: Bundle official MariaDB and Caddy (pinned in desk/componenti.json)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $c = Get-Content ../../componenti.json -Raw | ConvertFrom-Json
          # MariaDB: SHA-256 fissato nel repository (dall'indice ufficiale downloads.mariadb.org).
          Invoke-WebRequest -Uri $c.mariadb.url -OutFile mariadb.zip
          if ((Get-FileHash mariadb.zip -Algorithm SHA256).Hash.ToLower() -ne $c.mariadb.sha256) { throw 'MariaDB checksum mismatch' }
          Remove-Item mdb-tmp -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive mariadb.zip -DestinationPath mdb-tmp
          $root = @(Get-ChildItem mdb-tmp -Directory)[0].FullName
          # Solo ciò che serve al server: niente suite di test, header, simboli di debug.
          foreach ($d in 'mysql-test','include','sql-bench') { Remove-Item (Join-Path $root $d) -Recurse -Force -ErrorAction SilentlyContinue }
          Get-ChildItem $root -Recurse -Include *.pdb,*.lib | Remove-Item -Force
          Get-ChildItem mariadb -Exclude LEGGIMI.txt | Remove-Item -Recurse -Force
          Get-ChildItem $root | Move-Item -Destination mariadb
          if (!(Test-Path mariadb/bin/mariadbd.exe)) { throw 'mariadbd.exe missing' }
          # Caddy: SHA-512 fissato nel repository (dal file checksums ufficiale della release).
          Invoke-WebRequest -Uri $c.caddy.url -OutFile caddy.zip
          if ((Get-FileHash caddy.zip -Algorithm SHA512).Hash.ToLower() -ne $c.caddy.sha512) { throw 'Caddy checksum mismatch' }
          Get-ChildItem caddy -Exclude LEGGIMI.txt | Remove-Item -Recurse -Force
          Expand-Archive caddy.zip -DestinationPath caddy
          & caddy/caddy.exe version
          if ($LASTEXITCODE -ne 0) { throw 'Caddy does not start' }
          "mariadb=$($c.mariadb.versione) caddy=$($c.caddy.versione)" | Set-Content versione-componenti.txt
      - name: Audit Rust dependencies
        shell: pwsh
        run: |
          cargo install cargo-audit --locked
          if ($LASTEXITCODE -ne 0) { throw 'Audit tool installation failed' }
          # Keep an unfiltered audit in the logs; only the two documented
          # Linux-stack warnings may be excepted after a Windows graph check.
          cargo audit --file ../../Cargo.lock
          if ($LASTEXITCODE -ne 0) { throw 'Dependency vulnerability or audit failure' }
          $graph = cargo tree --locked --workspace --target x86_64-pc-windows-msvc --prefix none --edges normal,build,dev
          if ($LASTEXITCODE -ne 0) { throw 'Windows dependency graph unavailable' }
          $graph | Set-Content windows-dependencies.txt
          if ($graph -match '^(glib|proc-macro-error) v') { throw 'Reviewed Linux dependencies present in Windows graph; security review required' }
          Write-Host 'Windows-only exceptions: RUSTSEC-2024-0370 and RUSTSEC-2024-0429; both crates absent from Windows dependency graph. Linux remains blocked pending remediation.'
          cargo audit --file ../../Cargo.lock --deny warnings --ignore RUSTSEC-2024-0370 --ignore RUSTSEC-2024-0429
          if ($LASTEXITCODE -ne 0) { throw 'Dependency audit failed' }
      - name: Check Rust code
        shell: pwsh
        run: |
          rustup component add clippy
          if ($LASTEXITCODE -ne 0) { throw 'Clippy setup failed' }
          cargo clippy --locked --workspace --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { throw 'Clippy failed' }
      - name: Test Rust (including Core start with bundled PHP)
        shell: pwsh
        run: |
          $env:EMP_TEST_CORE_PACKAGES = (Resolve-Path pacchetti).Path
          $env:EMP_TEST_PHP = (Resolve-Path php/php.exe).Path
          cargo test --locked --workspace -- --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'Tests failed' }
      - name: Build emp-servizi with the component manifest
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $versions = ((Get-Content versione-php.txt) + ' ' + (Get-Content versione-componenti.txt)).Split(' ', [StringSplitOptions]::RemoveEmptyEntries)
          cargo run --locked --release -p emp-server --bin emp-servizi -- manifest . @versions | Set-Content -Encoding utf8NoBOM runtime-manifest.json
          if ($LASTEXITCODE -ne 0) { throw 'Manifest generation failed' }
          $env:EMP_RUNTIME_MANIFEST = (Resolve-Path runtime-manifest.json).Path
          cargo build --locked --release -p emp-server
          if ($LASTEXITCODE -ne 0) { throw 'emp-servizi build failed' }
          Copy-Item ../../target/release/emp-servizi.exe servizi/emp-servizi.exe -Force
          & servizi/emp-servizi.exe stato
          if ($LASTEXITCODE -ne 0) { throw 'emp-servizi does not start' }
      - name: Install Tauri CLI
        shell: pwsh
        run: cargo install tauri-cli --version "^2" --locked
      - name: Build Windows installer
        shell: pwsh
        run: cargo tauri build --bundles nsis
      - name: Scan binaries with Microsoft Defender
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $status = Get-MpComputerStatus
          $status | Select-Object AMServiceEnabled,AntivirusEnabled,RealTimeProtectionEnabled,AMRunningMode,AntivirusSignatureAge | Format-List
          if (!$status.AMServiceEnabled -or !$status.AntivirusEnabled) {
            Write-Host 'Attempting to start the existing Defender service on the disposable CI runner.'
            Start-Service -Name WinDefend -ErrorAction Stop
            $status = Get-MpComputerStatus
          }
          if (!$status.AMServiceEnabled -or !$status.AntivirusEnabled) { throw 'Defender engine unavailable; an approved dedicated scanning runner is required. No artifact will be published.' }
          if (!$status.RealTimeProtectionEnabled) { Write-Host 'Real-time protection inactive: explicit on-demand scanning is mandatory.' }
          Update-MpSignature
          $status = Get-MpComputerStatus
          if (!$status.AntivirusEnabled -or !$status.AMServiceEnabled -or $null -eq $status.AntivirusSignatureAge -or $status.AntivirusSignatureAge -gt 1) { throw 'Defender signatures are not current' }
          $platform = Join-Path $env:ProgramData 'Microsoft\Windows Defender\Platform'
          $scanner = Get-ChildItem $platform -Directory -ErrorAction SilentlyContinue | Sort-Object Name -Descending | ForEach-Object { Join-Path $_.FullName 'MpCmdRun.exe' } | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (!$scanner) { $scanner = Join-Path $env:ProgramFiles 'Windows Defender\MpCmdRun.exe' }
          if (!(Test-Path $scanner)) { throw 'Defender scanner unavailable' }
          $start = Get-Date
          $files = @(Get-Item ../../target/release/emp-desk.exe) + @(Get-Item servizi/emp-servizi.exe) + @(Get-ChildItem ../../target/release/bundle/nsis/*.exe)
          foreach ($file in $files) {
            $before = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash
            $scanOutput = & $scanner -Scan -ScanType 3 -File $file.FullName -DisableRemediation 2>&1
            $scanExit = $LASTEXITCODE
            $scanOutput | Write-Host
            if ($scanExit -ne 0 -or !(Test-Path -LiteralPath $file.FullName)) { throw 'Antivirus scan failed or detected a threat' }
            if (($scanOutput -join "`n") -match '(?im)^\s*(Threat\s+Name|Threat\s+ID|Threat\s+detected)\s*:') { throw 'Defender reported a threat in scan output' }
            if ((Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash -ne $before) { throw 'Scanned file changed' }
          }
          $detections = @(Get-MpThreatDetection | Where-Object { $_.InitialDetectionTime -ge $start })
          if ($detections.Count -gt 0) { throw 'Defender reported a detection during validation' }
      - name: End-to-end — install the environment as a Windows service
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = (Resolve-Path servizi/emp-servizi.exe).Path
          $src = (Resolve-Path .).Path
          function Show-Logs { Get-ChildItem "$env:ProgramData\EMP\log" -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "----- $($_.Name)"; Get-Content $_.FullName -Tail 40 } }
          # Porte occupate sul runner da servizi preinstallati: liberate solo qui (macchina usa e getta).
          foreach ($svc in 'W3SVC','MySQL','MySQL80','postgresql-x64-14') { Stop-Service $svc -Force -ErrorAction SilentlyContinue }
          & $exe installa --sorgente $src
          if ($LASTEXITCODE -ne 0) { Show-Logs; throw 'Environment installation failed' }
          $svc = Get-CimInstance Win32_Service -Filter "Name='EMPServer'"
          Write-Host "Servizio: $($svc.State), avvio $($svc.StartMode), account $($svc.StartName)"
          if ($svc.StartName -ne 'NT AUTHORITY\LocalService' -or $svc.StartMode -ne 'Auto') { throw 'Service account or start mode not as expected' }
          $h = Invoke-RestMethod http://127.0.0.1/api/v1/salute
          if ($h.stato -ne 'ok') { throw 'Core health check failed' }
          # MariaDB non deve ascoltare su altre interfacce.
          $db = Get-NetTCPConnection -LocalPort 3306 -State Listen
          $db | Format-Table LocalAddress,LocalPort | Out-String | Write-Host
          if (@($db | Where-Object { $_.LocalAddress -ne '127.0.0.1' }).Count -gt 0) { throw 'MariaDB listens beyond 127.0.0.1' }
          $web = Get-NetTCPConnection -LocalPort 80 -State Listen
          if (@($web | Where-Object { $_.LocalAddress -ne '127.0.0.1' }).Count -gt 0) { throw 'Caddy listens beyond 127.0.0.1' }
          # Primo setup del Tecnico e accesso (MariaDB).
          $hdr = @{ 'X-EMP-Richiesta' = '1' }
          $setup = Invoke-RestMethod -Method Post -Uri http://127.0.0.1/api/v1/accesso/setup -Headers $hdr -ContentType 'application/json' -Body '{"username":"tecnico","nome":"Tecnico CI","password":"Chiave-Sicura-CI-2026"}'
          if (-not $setup.recovery_key.StartsWith('EMP-')) { throw 'Setup failed' }
          $sess = $null
          $login = Invoke-RestMethod -Method Post -Uri http://127.0.0.1/api/v1/accesso/login -Headers $hdr -ContentType 'application/json' -Body '{"username":"tecnico","password":"Chiave-Sicura-CI-2026"}' -SessionVariable sess
          if ($login.utente.ruolo -ne 'tecnico') { throw 'Login failed' }
          $plugins = Invoke-RestMethod -Uri http://127.0.0.1/api/v1/plugin -WebSession $sess
          if ($plugins.core -ne (Get-Content ../../../core/emp-module.json -Raw | ConvertFrom-Json).version) { throw 'Core version mismatch' }
          # Riavvio del servizio: i dati restano.
          Restart-Service EMPServer
          Start-Sleep -Seconds 5
          $state = Invoke-RestMethod http://127.0.0.1/api/v1/accesso/stato
          if (-not $state.inizializzato) { throw 'Data lost after service restart' }
          # Aggiornamento (seconda installazione) e permessi dei dati.
          & $exe installa --sorgente $src
          if ($LASTEXITCODE -ne 0) { Show-Logs; throw 'Environment update failed' }
          $acl = (Get-Acl "$env:ProgramData\EMP\segreti").Access | ForEach-Object { $_.IdentityReference.Value }
          Write-Host "Permessi segreti: $($acl -join ', ')"
          if ($acl -match 'Users|Utenti|Everyone|Authenticated') { throw 'Secrets readable by ordinary users' }
          & $exe stato
          # Disinstallazione: servizio rimosso, dati conservati.
          & $exe disinstalla
          if ($LASTEXITCODE -ne 0) { Show-Logs; throw 'Uninstall failed' }
          if (Get-Service EMPServer -ErrorAction SilentlyContinue) { throw 'Service still present' }
          if (!(Test-Path "$env:ProgramData\EMP\mariadb\mysql")) { throw 'Data removed by uninstall' }
          Show-Logs
      - name: Collect release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $setup = @(Get-ChildItem ../../target/release/bundle/nsis/*.exe)
          if ($setup.Count -ne 1) { throw 'Expected exactly one NSIS installer' }
          Copy-Item $setup[0].FullName dist/
          Copy-Item ../../README.md dist/INSTALLATION.md
          Copy-Item ../../Cargo.lock dist/Cargo.lock
          Copy-Item pacchetti/emp-packages.json dist/emp-packages.json
          New-Item -ItemType Directory -Force dist/pacchetti | Out-Null
          Copy-Item pacchetti/*.zip dist/pacchetti/
          Copy-Item windows-dependencies.txt dist/windows-dependencies.txt
          Copy-Item php-version.txt dist/php-version.txt
          Copy-Item versione-componenti.txt dist/versione-componenti.txt
          Copy-Item runtime-manifest.json dist/runtime-manifest.json
          cargo tree --locked | Set-Content dist/dependencies.txt
          if ($LASTEXITCODE -ne 0) { throw 'Dependency inventory failed' }
          Get-ChildItem dist/*.exe | Get-FileHash -Algorithm SHA256 | ForEach-Object { "$($_.Hash)  $([IO.Path]::GetFileName($_.Path))" } | Set-Content dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: EMP-Desk-security-validation-UNSIGNED
          path: desk/app/src-tauri/dist/
          if-no-files-found: error
