[package]
name = "emp-desk"
version = "0.5.0-alpha.1"
description = "EMP Desk — Edomea Marketplace: ambiente Server/Client e installazione del Core"
edition.workspace = true
license.workspace = true
repository.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
emp-core-installer = { path = "../../crates/emp-core-installer" }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.33"
