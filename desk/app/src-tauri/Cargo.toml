[package]
name = "emp-desk"
version = "0.5.0-alpha.3"
description = "EMP Desk — Edomea Marketplace: ambiente Server/Client e installazione del Core"
edition.workspace = true
license.workspace = true
repository.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
emp-core-installer = { path = "../../crates/emp-core-installer" }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.33"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_Shell", "Win32_Foundation", "Win32_System_Threading", "Win32_System_Registry"] }
