[package]
name = "emp-core-installer"
version = "0.1.0"
description = "EMP Desk: verifica e installazione del pacchetto del Core (emp-core)"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
zip = { version = "9", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"
