# EMP Server — sito Nginx. Generato da installa.sh: le modifiche manuali vengono sovrascritte.
#
# - Porta 80: solo il certificato dell'autorità locale (/emp-ca.crt) e il rinvio a HTTPS.
# - Porta 443: EMP Core. Radice pubblica = cartella public/ del Core; tutto il resto è fuori dal web.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    server_tokens off;

    location = /emp-ca.crt {
        root @EMP_DATA@/pubblico;
        default_type application/x-x509-ca-cert;
        add_header Content-Disposition 'attachment; filename="EMP-CA-locale.crt"';
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    server_tokens off;

    ssl_certificate     @EMP_TLS@/server.crt;
    ssl_certificate_key @EMP_TLS@/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:EMP:5m;
    ssl_session_tickets off;

    root @EMP_MODULES@/emp-core/public;
    index index.html;
    client_max_body_size 1m;

    access_log /var/log/nginx/emp-accessi.log;
    error_log  /var/log/nginx/emp-errori.log warn;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    location = / {
        return 302 /admin/;
    }

    location = /emp-ca.crt {
        root @EMP_DATA@/pubblico;
        default_type application/x-x509-ca-cert;
    }

    # Pagine statiche: /techadmin/ Amministratore Tecnico, /admin/ Amministratore Operativo
    # e utenti operativi, /assets/ file comuni.
    # "expires epoch" = Cache-Control: no-cache: il browser ricontrolla i file a ogni apertura
    # (risposta 304 se invariati), così dopo un aggiornamento di EMP non usa pagine e script vecchi.
    location /techadmin/ {
        expires epoch;
        try_files $uri $uri/ =404;
    }
    location /admin/ {
        expires epoch;
        try_files $uri $uri/ =404;
    }
    location /assets/ {
        expires epoch;
        try_files $uri =404;
    }

    # Pagine dei plugin (cartella public/ di ogni modulo installato): /m/<id>/pagina.html.
    location ~ ^/m/([a-z][a-z0-9-]{2,63})/([a-z0-9][a-z0-9.-]{0,80})$ {
        expires epoch;
        alias @EMP_MODULES@/$1/public/$2;
    }
    # File pubblici dei plugin (es. foto dei prodotti): dati-moduli/<id>/pubblico/.
    location ~ ^/m-file/([a-z][a-z0-9-]{2,63})/((?!.*\.\.)[A-Za-z0-9][A-Za-z0-9._/-]{0,200})$ {
        alias @EMP_DATA@/dati-moduli/$1/pubblico/$2;
        add_header Content-Security-Policy "default-src 'none'" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # Foto e file dei plugin caricati dalle pagine (es. EMP Studio): fino a 16 MB.
    location ~ ^/api/v1/[a-z][a-z0-9-]*/media$ {
        client_max_body_size 16m;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_PROXY "";
        fastcgi_pass unix:/run/php/emp.sock;
        fastcgi_read_timeout 120s;
    }

    # Vecchio indirizzo (fino a 0.6.0-alpha.2): le pagine del Tecnico sono ora in /techadmin/.
    location /amministrazione/ {
        rewrite ^/amministrazione/(.*)$ /techadmin/$1 permanent;
    }

    # Nessun file nascosto o PHP diverso dal punto d'ingresso.
    location ~ /\. { deny all; }

    # Caricamento manuale di un plugin (pagina Plugin, solo Tecnico): pacchetti fino a 64 MB.
    location = /api/v1/plugin/carica {
        client_max_body_size 64m;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_PROXY "";
        fastcgi_pass unix:/run/php/emp.sock;
        fastcgi_read_timeout 120s;
    }

    # Backup da scaricare (pagina Backup, solo Tecnico): il Core controlla l'accesso e passa
    # il file a Nginx (X-Accel-Redirect). Non raggiungibile direttamente dal browser.
    location ^~ /_emp_scaricamenti/ {
        internal;
        alias @EMP_DATA@/scaricamenti/;
        default_type application/x-tar;
    }

    # API e tutto il resto: punto d'ingresso unico del Core.
    location / {
        try_files /index.php =503;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_PROXY "";
        fastcgi_pass unix:/run/php/emp.sock;
        fastcgi_read_timeout 120s;
    }
}
