; EMP Server — gruppo PHP-FPM del Core. Generato da installa.sh.
; Gira come utente di sistema "emp", separato da Nginx (www-data) e dagli altri siti.
[emp]
user = emp
group = emp
listen = /run/php/emp.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = dynamic
pm.max_children = 8
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests = 500

clear_env = yes
env[EMP_CONFIG] = @EMP_CONFIG@
security.limit_extensions = .php

php_admin_value[open_basedir] = @EMP_DATA@:@EMP_CONFIG@:@EMP_BOOT_CONF@
php_admin_value[sys_temp_dir] = @EMP_DATA@/tmp
php_admin_value[upload_tmp_dir] = @EMP_DATA@/tmp
php_admin_value[memory_limit] = 256M
; Pacchetti dei plugin caricati dalla pagina Plugin (Nginx li limita a 64 MB solo su quella rotta).
php_admin_value[post_max_size] = 64M
php_admin_value[max_execution_time] = 120
php_admin_flag[display_errors] = off
php_admin_flag[log_errors] = on
php_admin_value[error_log] = /var/log/emp/php-errori.log
php_admin_flag[expose_php] = off
php_admin_flag[allow_url_fopen] = off
php_admin_value[disable_functions] = exec,shell_exec,system,passthru,proc_open,popen,pcntl_exec
php_admin_value[date.timezone] = Europe/Rome
php_admin_value[session.use_strict_mode] = 1
