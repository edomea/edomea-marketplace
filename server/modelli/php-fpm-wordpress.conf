; EMP Server — gruppo PHP-FPM del WordPress del negozio. Generato da installa.sh.
; Gira come utente di sistema "wordpress", separato dal Core (utente emp) e da Nginx (www-data):
; WordPress e i suoi plugin non possono leggere né modificare i file e il database di EMP.
[emp-wordpress]
user = wordpress
group = wordpress
listen = /run/php/emp-wordpress.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = dynamic
pm.max_children = 12
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 4
pm.max_requests = 500

clear_env = yes
security.limit_extensions = .php

php_admin_value[open_basedir] = @EMP_DATA@/wordpress
php_admin_value[sys_temp_dir] = @EMP_DATA@/wordpress/tmp
php_admin_value[upload_tmp_dir] = @EMP_DATA@/wordpress/tmp
php_admin_value[memory_limit] = 512M
php_admin_value[post_max_size] = 64M
php_admin_value[upload_max_filesize] = 64M
php_admin_value[max_execution_time] = 300
php_admin_value[max_input_vars] = 5000
php_admin_flag[display_errors] = off
php_admin_flag[log_errors] = on
php_admin_value[error_log] = /var/log/emp-wordpress/php-errori.log
php_admin_flag[expose_php] = off
php_admin_value[disable_functions] = exec,shell_exec,system,passthru,proc_open,popen,pcntl_exec
php_admin_value[date.timezone] = Europe/Rome
php_admin_value[session.save_path] = @EMP_DATA@/wordpress/tmp
